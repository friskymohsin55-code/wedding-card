name: Rename wedding file
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git mv wedding-card-website.html index.html
          git config user.name "friskymohsin55-code"
          git config user.email "friskymohsin55@gmail.com"
          git commit -m "Rename wedding-card-website.html to index.html"
          git push
